# 교회 홈페이지(tvpc.church)의 소식·일정을 매일 Firestore에 자동 등록.
# FIREBASE_SERVICE_ACCOUNT 시크릿을 사용 (설교 동기화와 공용).
name: Sync news from church website

on:
  schedule:
    # 매일 08:10 태평양 시간(PT) 무렵 — 15:10 UTC
    - cron: '10 15 * * *'
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Check secret
        env:
          SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          if [ -z "$SA" ]; then
            echo "FIREBASE_SERVICE_ACCOUNT 시크릿이 없어 동기화를 건너뜁니다."
            echo "skip=true" >> "$GITHUB_ENV"
          fi

      - name: Install firebase-admin
        if: env.skip != 'true'
        run: npm install --no-save firebase-admin

      - name: Sync news & events
        if: env.skip != 'true'
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: node scripts/sync-news.mjs
