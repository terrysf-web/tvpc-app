# 은혜안에 찬양팀 유튜브 채널(@EUNHYEANEWORSHIP)의 새 영상을 매주 Firestore에
# 자동 등록. 교회 미디어 > "찬양" 탭에 표시된다.
#
# 시크릿은 sync-sermons.yml과 동일한 FIREBASE_SERVICE_ACCOUNT를 그대로 쓴다
# (이미 등록되어 있으면 추가 설정 없이 바로 동작).
name: Sync praise videos from YouTube

on:
  schedule:
    # 매주 수요일 저녁 7시(태평양 시간, PDT UTC-7 기준 → 목요일 오전 2시 UTC).
    # 깃허브 Actions cron은 UTC 고정이라 서머타임이 끝나면(11월) 실제
    # 태평양 시간 기준 1시간씩 밀린다 — 필요하면 그때 다시 조정.
    - cron: '0 2 * * 4'
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Check secret
        env:
          SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          if [ -z "$SA" ]; then
            echo "FIREBASE_SERVICE_ACCOUNT 시크릿이 없어 동기화를 건너뜁니다."
            echo "skip=true" >> "$GITHUB_ENV"
          fi

      - name: Install firebase-admin
        if: env.skip != 'true'
        run: npm install --no-save firebase-admin

      # 임시 진단: 재생목록 4개의 실제 제목이 뭔지 확인 — "YYMMDD[태그]"
      # 패턴 매치가 0개로 나와서, 실제 이름이 그 형식이 아닌 것 같다.
      - name: Debug - playlist titles
        if: env.skip != 'true'
        run: |
          for pid in $(curl -s "https://www.youtube.com/@EUNHYEANEWORSHIP/playlists" | grep -oE '"playlistId":"PL[A-Za-z0-9_-]+"' | sed -E 's/.*"(PL[A-Za-z0-9_-]+)"/\1/' | sort -u); do
            title=$(curl -s "https://www.youtube.com/feeds/videos.xml?playlist_id=$pid" | grep -oE '<title>[^<]*</title>' | head -1)
            echo "$pid -> $title"
          done

      - name: Sync praise videos
        if: env.skip != 'true'
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: node scripts/sync-praise.mjs
