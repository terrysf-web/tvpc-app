# 은혜안에 찬양팀 유튜브 채널(@EUNHYEANEWORSHIP)의 새 영상을 Firestore에
# 자동 등록. 교회 미디어 > "찬양" 탭에 표시된다.
#
# 시크릿은 sync-sermons.yml과 동일한 FIREBASE_SERVICE_ACCOUNT를 그대로 쓴다
# (이미 등록되어 있으면 추가 설정 없이 바로 동작).
name: Sync praise videos from YouTube

on:
  schedule:
    # 2시간마다 — 설교 동기화와 같은 간격. 예전에는 수요일 저녁 한 번만
    # 돌아서, 찬양팀이 다른 요일에 올리면 최대 일주일 뒤에야 앱에 보였다.
    # 채널 페이지를 한 번 읽는 가벼운 일이고 새 영상만 더하므로 자주 돌아도
    # 중복이 생기지 않는다.
    - cron: '0 */2 * * *'
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Check secret
        env:
          SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          if [ -z "$SA" ]; then
            echo "FIREBASE_SERVICE_ACCOUNT 시크릿이 없어 동기화를 건너뜁니다."
            echo "skip=true" >> "$GITHUB_ENV"
          fi

      - name: Install firebase-admin
        if: env.skip != 'true'
        run: npm install --no-save firebase-admin

      - name: Sync praise videos
        if: env.skip != 'true'
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: node scripts/sync-praise.mjs
