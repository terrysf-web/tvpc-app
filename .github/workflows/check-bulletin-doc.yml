name: Check bulletin doc (one-off)

on:
  workflow_dispatch:
    inputs:
      target_date:
        description: '조회할 주보 날짜(YYYY-MM-DD). 비워두면 최신 주보.'
        required: false
        type: string

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install firebase-admin
        run: npm install --no-save firebase-admin
      - name: Check
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          TARGET_DATE: ${{ inputs.target_date }}
        run: node scripts/check-bulletin-doc.mjs
