# 말씀카드 배경 후보 사진을 모아 브랜치에 올린다 (고르기 위한 미리보기용).
name: Fetch background candidates

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: claude/react-native-firebase-app-e0vg1r

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install sharp
        run: npm install --no-save sharp

      - name: Fetch candidates
        run: node scripts/fetch-bg-candidates.mjs

      - name: Commit
        run: |
          git config user.name "bg-picker-bot"
          git config user.email "actions@users.noreply.github.com"
          git add preview/bg-candidates
          if git diff --cached --quiet; then
            echo "변경 없음"
          else
            git commit -m "배경 후보 사진 모음 (고르기용)"
            git push
          fi
