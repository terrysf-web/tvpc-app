# 같은 설교가 여러 번 올라와 있는지 확인(읽기 전용).
name: Check sermon duplicates (one-off)

on:
  workflow_dispatch:
    inputs:
      date:
        description: '특정 날짜만 보기 YYYY-MM-DD (비우면 전체에서 겹치는 것)'
        required: false
      find:
        description: '제목으로 찾기 (띄어쓰기 무시)'
        required: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-save firebase-admin @google-cloud/firestore @google-cloud/storage
      - env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          DATE: ${{ inputs.date }}
          FIND: ${{ inputs.find }}
        run: node scripts/check-sermon-dupes.mjs
