# 교회 미디어 "영상" 탭에 무엇이 보이고 무엇이 숨는지 확인(읽기 전용).
name: Check media videos (one-off)

on:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install firebase-admin
        run: npm install --no-save firebase-admin @google-cloud/firestore @google-cloud/storage
      - name: Check
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: node scripts/check-media-videos.mjs
