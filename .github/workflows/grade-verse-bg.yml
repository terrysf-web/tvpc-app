# 말씀카드 배경 이미지 한 장 → 시간대별 5종 생성 후 커밋.
# 실행: Actions에서 image_url에 원본 그림 주소를 넣고 Run workflow.
name: Grade verse background

on:
  workflow_dispatch:
    inputs:
      image_url:
        description: '원본 그림 URL (밝은 낮 풍경)'
        required: true

permissions:
  contents: write

jobs:
  grade:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install sharp
        run: npm install --no-save sharp

      - name: Generate time-of-day variants
        env:
          IMAGE_URL: ${{ inputs.image_url }}
        run: node scripts/grade-verse-bg.mjs

      - name: Commit results
        run: |
          git config user.name "verse-bg-bot"
          git config user.email "actions@users.noreply.github.com"
          git add public/verse-bg-*.jpg
          if git diff --cached --quiet; then
            echo "변경 없음"
          else
            git commit -m "말씀카드 시간대별 배경 갱신 (원본: 사용자 제공 그림)"
            git push
          fi
