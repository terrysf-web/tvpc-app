# 유튜브 채널의 재생목록 목록을 확인(읽기 전용).
name: Check channel playlists (one-off)

on:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/check-channel-playlists.mjs
