# 일회성 — 표어(welcome/motto) 문서 내용 확인용(읽기 전용)
name: Check motto (one-off)

on:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install firebase-admin
        run: npm install --no-save firebase-admin
      - name: Check
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: node scripts/check-motto.mjs
