# 일정(events)을 날짜순으로 확인(읽기 전용).
name: Check scripture refs (one-off)

on:
  workflow_dispatch:
    inputs:
      from:
        description: '시작 날짜 YYYY-MM-DD (비워도 됨)'
        required: false
      to:
        description: '끝 날짜 YYYY-MM-DD (비워도 됨)'
        required: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-save firebase-admin @google-cloud/firestore @google-cloud/storage
      - env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          FROM: ${{ inputs.from }}
          TO: ${{ inputs.to }}
        run: node scripts/check-refs.mjs
