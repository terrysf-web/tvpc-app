# 오후 7시(태평양) 타임 — 오늘의 말씀·감사일기 통합 발송.
# 알림 시각을 오후 7시로 고른 기기들만 대상(더보기 탭 알림 설정,
# src/push.ts의 NOTIFICATION_TIMES 참고). scripts/send-scheduled-push.mjs가
# 실제 발송을 맡는다.
name: Push scheduled 19:00

on:
  schedule:
    # 깃허브 예약 실행은 공용 대기줄이라 1시간 반~2시간 반씩 늦게 시작하는
    # 일이 잦다(실측, push-scheduled-0800 참고). 그래서 넉넉히 일찍
    # (23:00 UTC = 태평양 오후 4시경) 깨어난 뒤, 아래 '7시까지 대기'
    # 단계에서 시각을 정확히 맞춰 보낸다.
    - cron: '0 23 * * *'
  workflow_dispatch:

jobs:
  push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Check secret
        env:
          SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          if [ -z "$SA" ]; then
            echo "FIREBASE_SERVICE_ACCOUNT 시크릿이 없어 건너뜁니다."
            echo "skip=true" >> "$GITHUB_ENV"
          fi

      - name: Install firebase-admin
        if: env.skip != 'true'
        run: npm install --no-save firebase-admin

      # 예약 실행이 얼마나 늦게 시작하든 발송은 태평양 저녁 7:00 정각에 —
      # 이미 7시가 지나 시작했다면 그냥 바로 보낸다.
      # (손으로 돌리는 workflow_dispatch 는 기다리지 않는다)
      - name: Wait until 7:00 PM Pacific
        if: env.skip != 'true' && github.event_name == 'schedule'
        run: |
          target=$(TZ=America/Los_Angeles date -d '19:00' +%s)
          now=$(date +%s)
          if [ "$now" -lt "$target" ]; then
            echo "태평양 저녁 7시까지 $(( (target - now) / 60 ))분 대기"
            sleep $((target - now))
          else
            echo "이미 태평양 저녁 7시가 지나 바로 보냅니다"
          fi

      - name: Send push
        if: env.skip != 'true'
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          TARGET_TIME: '19:00'
        run: node scripts/send-scheduled-push.mjs
