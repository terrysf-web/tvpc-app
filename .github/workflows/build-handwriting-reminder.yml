name: Build Handwriting Reminder APK

on:
  pull_request:
    branches:
      - claude/react-native-firebase-app-e0vg1r
    paths:
      - 'handwriting-reminder/**'
      - '.github/workflows/build-handwriting-reminder.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build debug APK
        working-directory: handwriting-reminder
        run: gradle assembleDebug --stacktrace
      - name: Rename APK
        run: cp handwriting-reminder/app/build/outputs/apk/debug/app-debug.apk Terry-Handwriting-Reminder-v1.0.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Terry-Handwriting-Reminder-APK
          path: Terry-Handwriting-Reminder-v1.0.apk
          if-no-files-found: error
