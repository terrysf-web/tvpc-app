# 데일리브레드 푸시 — 매일 아침 오늘의 말씀이 등록돼 있으면 알림 발송.
# 앱의 더보기 탭에서 "말씀 알림"을 켠 기기들에 전송된다.
name: Push daily verse

on:
  schedule:
    # 매일 06:00 태평양 시간(PT) 무렵 — 13:00 UTC
    - cron: '0 13 * * *'
  workflow_dispatch:

jobs:
  push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Check secret
        env:
          SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          if [ -z "$SA" ]; then
            echo "FIREBASE_SERVICE_ACCOUNT 시크릿이 없어 건너뜁니다."
            echo "skip=true" >> "$GITHUB_ENV"
          fi

      - name: Install firebase-admin
        if: env.skip != 'true'
        run: npm install --no-save firebase-admin

      - name: Send push
        if: env.skip != 'true'
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: node scripts/send-daily-verse.mjs
