# 일회성 — 테스트로 보냈던 긴급 알림 정리
name: Delete test alerts (one-off)

on:
  workflow_dispatch:

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install firebase-admin
        run: npm install --no-save firebase-admin
      - name: Delete
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: node scripts/delete-test-alerts.mjs
