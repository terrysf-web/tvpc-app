# 교회 홈페이지 설교 목록에 한 건이 어떻게 적혀 있는지 확인(읽기 전용).
name: Check website sermon (one-off)

on:
  workflow_dispatch:
    inputs:
      pages:
        description: '몇 페이지까지 볼지 (비우면 12)'
        required: false
      show:
        description: '앞 N건의 날짜 후보를 자세히 (비우면 0)'
        required: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - env:
          PAGES: ${{ inputs.pages }}
          SHOW: ${{ inputs.show }}
        run: node scripts/check-web-sermon.mjs
