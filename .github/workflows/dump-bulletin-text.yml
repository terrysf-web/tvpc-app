# 일회성 진단 — 현재 주보 PDF의 실제 텍스트 내용을 로그로 확인
# (앱 스타일 텍스트 카드로 옮기기 위한 실제 내용 확인용. 작업 끝나면 삭제해도 됨)
name: Dump bulletin text (diagnostic)

on:
  workflow_dispatch:

jobs:
  dump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install poppler
        run: sudo apt-get update -q && sudo apt-get install -y -q poppler-utils
      - name: Install deps
        run: npm install --no-save firebase-admin playwright && npx playwright install --with-deps chromium
      - name: Dump text
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          TVPC_WEB_USER: ${{ secrets.TVPC_WEB_USER }}
          TVPC_WEB_PASS: ${{ secrets.TVPC_WEB_PASS }}
        run: node scripts/dump-bulletin-text.mjs
