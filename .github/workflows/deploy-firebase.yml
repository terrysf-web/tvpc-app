# Firebase Hosting 자동 배포 — https://happytvpc.web.app
#
# 활성화 방법 (1회): Firebase 콘솔 → 프로젝트 설정 → 서비스 계정 →
# "새 비공개 키 생성"으로 받은 JSON 전체를 GitHub 레포
# Settings → Secrets and variables → Actions → (Secrets 탭) 에
# FIREBASE_SERVICE_ACCOUNT 이름으로 등록. 시크릿이 없으면 조용히 건너뜁니다.
name: Deploy web to Firebase Hosting

on:
  push:
    branches:
      - claude/react-native-firebase-app-e0vg1r
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Check secret
        env:
          SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          if [ -z "$SA" ]; then
            echo "FIREBASE_SERVICE_ACCOUNT 시크릿이 없어 배포를 건너뜁니다."
            echo "skip=true" >> "$GITHUB_ENV"
          fi

      - name: Install dependencies
        if: env.skip != 'true'
        run: npm ci

      - name: Export web build
        if: env.skip != 'true'
        run: npx expo export --platform web && node scripts/inject-pwa.mjs

      - name: Deploy to Firebase Hosting
        if: env.skip != 'true'
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          projectId: tvpc-40043
          channelId: live

      # firebase-tools는 배포 전 serviceusage API 점검에서 403이 나므로
      # Rules API를 직접 호출하는 스크립트로 배포한다
      - name: Deploy Firestore rules
        if: env.skip != 'true'
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          npm install --no-save google-auth-library
          node scripts/deploy-rules.mjs
