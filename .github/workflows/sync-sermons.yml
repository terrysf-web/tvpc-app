# 유튜브 채널(@tri-valley)의 새 설교 영상을 매일 Firestore에 자동 등록.
#
# 활성화 방법 (1회):
#   1. Firebase 콘솔 → 프로젝트 설정(톱니) → 서비스 계정 → "새 비공개 키 생성" → JSON 다운로드
#   2. GitHub 레포 → Settings → Secrets and variables → Actions → New repository secret
#      이름: FIREBASE_SERVICE_ACCOUNT / 값: 다운로드한 JSON 파일 내용 전체
#   3. Actions 탭에서 이 워크플로를 "Run workflow"로 즉시 실행해 확인
name: Sync sermons from YouTube

on:
  schedule:
    # 2시간마다 — 새 설교·팟캐스트가 올라오면 늦어도 2시간 안에 앱에 반영
    - cron: '0 */2 * * *'
  workflow_dispatch:
    inputs:
      backfill:
        description: '채널 전체 영상 백필 (true = 과거 팟캐스트·설교 전부 가져오기)'
        required: false
        default: 'false'

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Check secret
        env:
          SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          if [ -z "$SA" ]; then
            echo "FIREBASE_SERVICE_ACCOUNT 시크릿이 없어 동기화를 건너뜁니다."
            echo "skip=true" >> "$GITHUB_ENV"
          fi

      - name: Install firebase-admin
        if: env.skip != 'true'
        run: npm install --no-save firebase-admin

      # 백필 모드에서 채널 전체 영상 목록 조회에 사용 (RSS는 최근 15개만 제공)
      - name: Install yt-dlp
        if: env.skip != 'true' && inputs.backfill == 'true'
        run: pip install --quiet yt-dlp

      # 임시 진단: 옛 팟캐스트 문서에 지금 저장된 preacher 값이 실제로
      # 비어 있는지(예전 OCR 값이 최근 커밋들에서 지워졌는지) 확인.
      # 확인 끝나면 이 스텝은 지운다.
      - name: Debug - current preacher values
        if: env.skip != 'true'
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          node - <<'EOF'
          import('firebase-admin/app').then(async ({ cert, initializeApp }) => {
            const { getFirestore } = await import('firebase-admin/firestore');
            const sa = JSON.parse(process.env.FIREBASE_SERVICE_ACCOUNT);
            initializeApp({ credential: cert(sa) });
            const db = getFirestore();
            const ids = ['yt-T7t-h8fcVEM', 'yt-poYcJr4H9f4'];
            for (const id of ids) {
              const doc = await db.doc(`sermons/${id}`).get();
              console.log(id, JSON.stringify(doc.data()));
            }
            process.exit(0);
          });
          EOF

      - name: Sync sermons
        if: env.skip != 'true'
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          BACKFILL: ${{ inputs.backfill || 'false' }}
        run: node scripts/sync-sermons.mjs
