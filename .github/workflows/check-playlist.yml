# 유튜브 재생목록에 무엇이 들어 있는지 확인(읽기 전용).
name: Check YouTube playlist (one-off)

on:
  workflow_dispatch:
    inputs:
      list_id:
        description: '재생목록 ID (PL... 부분만)'
        required: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check
        env:
          LIST_ID: ${{ inputs.list_id }}
        run: node scripts/check-playlist.mjs
