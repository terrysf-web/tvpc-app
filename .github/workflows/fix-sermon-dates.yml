# 설교 날짜를 유튜브에 맞춰 바로잡는다. 기본은 보기만 하고, apply를 켜야 고친다.
name: Fix sermon dates (one-off)

on:
  workflow_dispatch:
    inputs:
      apply:
        description: '실제로 고치기 (끄면 무엇이 바뀌는지 보기만)'
        required: false
        type: boolean
        default: false

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-save firebase-admin @google-cloud/firestore @google-cloud/storage
      - env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          APPLY: ${{ inputs.apply && '1' || '0' }}
        run: node scripts/fix-sermon-dates.mjs
