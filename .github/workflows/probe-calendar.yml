# 교회 홈페이지 달력 원본을 확인(읽기 전용).
name: Probe church calendar (one-off)

on:
  workflow_dispatch:
    inputs:
      find:
        description: '찾을 낱말 (비우면 성찬)'
        required: false

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - env:
          FIND: ${{ inputs.find }}
        run: node scripts/probe-calendar.mjs
