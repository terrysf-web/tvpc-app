# 일회성 — 실수로 지웠던 홈페이지발 교회 소식 카드 복원
name: Restore web-scraped news (one-off)

on:
  workflow_dispatch:

jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install firebase-admin
        run: npm install --no-save firebase-admin
      - name: Restore
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          TVPC_WEB_USER: ${{ secrets.TVPC_WEB_USER }}
          TVPC_WEB_PASS: ${{ secrets.TVPC_WEB_PASS }}
        run: node scripts/restore-web-news.mjs
