# 긴급 알림 발송 — 관리자 화면에서 긴급 알림을 등록하면
# 앱이 이 워크플로를 바로 깨워(workflow_dispatch) 약 1분 안에 전송한다.
#
# 깨우기가 실패한 경우를 대비한 예비 발송은 Cloud Scheduler가 맡는다
# (functions/index.js의 triggerSendAlert — 5분마다 남은 알림이 있는지 보고
# 있을 때만 이 워크플로를 깨운다).
#
# 예전에는 여기에 깃허브 자체 예약(*/5 cron)을 걸어 두었는데, 공용
# 대기열이라 실제로는 6~10시간에 한 번씩밖에 돌지 않았다(2026-10-12 실측).
# 예비책이 반나절에 한 번이면 그물 구실을 못 해서 옮겼다. 덤으로, 보낼
# 알림이 없는 날 하루 288번 헛도는 일도 없어졌다.
name: Send emergency alert

on:
  workflow_dispatch:

# 즉시 실행과 예비 실행이 겹쳐도 동시에 돌지 않게 한 줄로 세운다
concurrency:
  group: send-alert
  cancel-in-progress: false

jobs:
  send:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Check secret
        env:
          SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          if [ -z "$SA" ]; then
            echo "FIREBASE_SERVICE_ACCOUNT 시크릿이 없어 건너뜁니다."
            echo "skip=true" >> "$GITHUB_ENV"
          fi

      - name: Install firebase-admin
        if: env.skip != 'true'
        run: npm install --no-save firebase-admin @google-cloud/firestore @google-cloud/storage

      - name: Send alerts
        if: env.skip != 'true'
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: node scripts/send-alert.mjs
