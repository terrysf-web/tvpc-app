# 긴급 알림 발송 — 관리자 화면에서 긴급 알림을 등록하면
# 앱이 이 워크플로를 바로 깨워(workflow_dispatch) 약 1분 안에 전송한다.
# 깨우기가 실패한 경우를 대비해 5분 간격 예비 실행이 남은 대기 알림을 발송한다.
# (공개 저장소라 GitHub Actions 실행 시간이 무료·무제한)
name: Send emergency alert

on:
  workflow_dispatch:
  schedule:
    - cron: '*/5 * * * *'

# 즉시 실행과 예비 실행이 겹쳐도 동시에 돌지 않게 한 줄로 세운다
concurrency:
  group: send-alert
  cancel-in-progress: false

jobs:
  send:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Check secret
        env:
          SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          if [ -z "$SA" ]; then
            echo "FIREBASE_SERVICE_ACCOUNT 시크릿이 없어 건너뜁니다."
            echo "skip=true" >> "$GITHUB_ENV"
          fi

      - name: Install firebase-admin
        if: env.skip != 'true'
        run: npm install --no-save firebase-admin

      - name: Send alerts
        if: env.skip != 'true'
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: node scripts/send-alert.mjs
