# Cloud Functions 배포 — 긴급 알림 즉시 발송 함수(functions/).
# Firebase 프로젝트가 Blaze 요금제일 때만 성공한다.
# functions/ 가 바뀔 때 자동 실행되고, 수동 실행(workflow_dispatch)도 가능.
name: Deploy Cloud Functions

on:
  push:
    branches:
      - claude/react-native-firebase-app-e0vg1r
      - main
    paths:
      - 'functions/**'
      - 'firebase.json'
      - '.github/workflows/deploy-functions.yml'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Check secret
        env:
          SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          if [ -z "$SA" ]; then
            echo "FIREBASE_SERVICE_ACCOUNT 시크릿이 없어 배포를 건너뜁니다."
            echo "skip=true" >> "$GITHUB_ENV"
          fi

      - name: Install functions dependencies
        if: env.skip != 'true'
        run: npm --prefix functions install

      - name: Deploy functions
        if: env.skip != 'true'
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT" > "$RUNNER_TEMP/sa.json"
          export GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/sa.json"
          npm install --no-save firebase-tools
          npx firebase-tools deploy --only functions --project tvpc-40043 --non-interactive --force
